[package]
name = "openjarvis"
description = "OpenJarvis for Windows and Linux — Mochi lives at the top of your screen"
authors = ["Louis Raille"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "openjarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
# In-app updates from GitHub Releases, signature-checked (updater.rs).
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# OS cryptographic RNG for OAuth PKCE/state and webhook delivery ids
# (already in the tree via other crates, so nothing new is downloaded).
getrandom = "0.2"
# Local dates and UTC offsets for Google Calendar (already in the tree).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Jarvis browser control: Chrome DevTools Protocol over a local websocket
# (ws://127.0.0.1 only, so no TLS stack is pulled in).
# Also the Jarvis voice (edge_tts.rs): wss to Microsoft's speech service, over
# the same rustls that reqwest already uses.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# The island's file drop reads paths straight from WebView2 (webview_drop.rs).
# Same versions as wry, so nothing new is compiled.
webview2-com = "0.39"
wv2_core = { package = "windows-core", version = "0.62" }
# The `#[interface]` macro (audio.rs) expands to `windows_core::…` paths: the
# same 0.61 that `windows` already uses.
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  # "Open terminal": the relay's process tree leads to the session's window.
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  # Notch PC widgets (pc_monitor.rs): GPU utilisation counters, disk space,
  # whether the foreground window covers its monitor.
  "Win32_System_Performance",
  "Win32_Storage_FileSystem",
  "Win32_Graphics_Gdi",
  # Using the PC's programs (pc_control.rs): their windows read and pressed
  # through UI Automation; hidden (cloaked) windows skipped.
  "Win32_UI_Accessibility",
  "Win32_Graphics_Dwm",
  # Translate the selection: Ctrl+C into the clipboard, read back as text.
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  # Audio outputs by name (fone / caixa) and the default device switch.
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_WinRT",
  # Media of any app (YouTube, VLC…): Windows' media sessions (SMTC).
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
] }
# Local wake word (wakeword.rs): the microphone read natively, and the user's
# own "Jarvis" spotted on the PC — no cloud call until a command is heard.
cpal = "0.15"
rustpotter = "3"
# Rustpotter's candle 0.2 does not build with half ≥ 2.5 (rand 0.9): keep 2.4.
half = "=2.4.1"
# FPS in games (pc_monitor.rs): counts the frames each process presents, from
# the DXGI / Direct3D 9 ETW providers — the way PresentMon does. Needs admin.
ferrisetw = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (GNOME Keyring, KWallet) over D-Bus, encrypted in transit.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2"
# The GTK that Tauri already runs on, to reach its window for layer-shell and
# the input region. libgtk-layer-shell itself is called directly (platform/linux.rs).
gtk = "0.18"
# libdbus, which keyring's Secret Service already links, so nothing new is
# downloaded: Wayland global shortcuts through the XDG GlobalShortcuts portal
# (portal.rs), the Spotify pill over MPRIS (spotify.rs) and "Open terminal"
# through KWin's scripting (platform/linux_focus.rs).
dbus = "0.9.12"
# EWMH on X11 for "Open terminal", already in the tree (global-hotkey).
x11rb = { version = "0.13", default-features = false }
